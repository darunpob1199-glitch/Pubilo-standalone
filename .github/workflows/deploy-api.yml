name: Deploy API Worker

on:
  push:
    branches:
      - main
      - dev
    paths:
      - "apps/api/**"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-prod:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - name: Release guard checks
        run: node scripts/smoke-release-guards.js

      - name: Install API dependencies
        run: cd apps/api && npm ci

      - name: Typecheck API
        run: cd apps/api && npx tsc --noEmit

      - name: Deploy production API worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: "53987ff7a0defba5fae5e72d3feb57ca"
          workingDirectory: "apps/api"
          command: deploy

  deploy-dev:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - name: Release guard checks
        run: node scripts/smoke-release-guards.js

      - name: Install API dependencies
        run: cd apps/api && npm ci

      - name: Typecheck API
        run: cd apps/api && npx tsc --noEmit

      - name: Deploy dev API worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: "53987ff7a0defba5fae5e72d3feb57ca"
          workingDirectory: "apps/api"
          command: deploy -c wrangler.dev.toml
